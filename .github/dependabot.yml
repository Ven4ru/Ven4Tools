version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # v4+ требует платной лицензии Six Labors — проект использует бесплатную
      # v3.x, апгрейд мажора невозможен без покупки лицензии.
      - dependency-name: "SixLabors.ImageSharp"
        update-types: ["version-update:semver-major"]
    groups:
      # TestAdapter и TestFramework должны бампиться одним PR — раздельные
      # версии двух пакетов из одного пакета MSTest не тестировались вместе
      # (round 36: раздельные PR #25/#26 дублировали друг друга).
      mstest:
        patterns:
          - "MSTest.*"
      # Три тестовых проекта в одном решении с разными версиями Test.Sdk/
      # xunit.runner.visualstudio — риск нестабильного дискавери тестов в CI
      # (round 39: раздельные PR #32/#34 развели версии по проектам).
      test-infra:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit.runner.visualstudio"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # init и analyze обязаны бампиться одним PR — CodeQL проверяет, что
      # версия конфига analyze совпадает с версией, записанной init, и падает
      # с "Loaded a configuration file for version X, but running version Y",
      # если раздельные PR смержены не в один момент (round 36: PR #29/#30,
      # и раньше #24/#27 — падало каждый раз на новом релизе codeql-action).
      codeql-action:
        patterns:
          - "github/codeql-action*"
