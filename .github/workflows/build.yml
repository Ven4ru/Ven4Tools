name: Проверка качества

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  quality:
    name: Сборка и тесты
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Настройка .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Восстановление зависимостей
        run: dotnet restore Ven4Tools.sln --nologo

      - name: Сборка solution
        run: dotnet build Ven4Tools.sln -c Release --no-restore --nologo -v minimal -warnaserror

      - name: Быстрые unit-тесты
        run: dotnet test tests/Ven4Tools.Tests/Ven4Tools.Tests.csproj -c Release -p:Platform=x64 -p:CollectCoverage=true --no-build --no-restore --nologo --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults/Unit

      # Вторая половина сверки правил доверия к источнику загрузки: лаунчер проверен
      # unit-тестом DownloadTrustVectorsTests, install.ps1 — тем же набором примеров.
      - name: Правила доверия install.ps1
        shell: pwsh
        run: ./tests/scripts/Test-InstallScriptTrustRules.ps1

      # Покрытие собиралось и проверялось по порогу, но нигде не показывалось:
      # узнать цифру можно было только из лога шага. Выводим в сводку прогона.
      - name: Сводка покрытия
        if: always()
        shell: pwsh
        run: |
          $path = 'TestResults/Coverage/coverage.cobertura.xml'
          if (-not (Test-Path $path)) {
            "### Покрытие`n`nФайл покрытия не создан — тесты не дошли до конца." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          [xml]$xml = Get-Content $path -Raw
          $culture = [System.Globalization.CultureInfo]::InvariantCulture
          function Format-Rate([string]$rate) {
            ([double]::Parse($rate, $culture) * 100).ToString('F1', $culture) + ' %'
          }
          $lines = @(
            '### Покрытие критического сервисного слоя'
            ''
            "Строки: **$(Format-Rate $xml.coverage.'line-rate')** · ветви: **$(Format-Rate $xml.coverage.'branch-rate')** · порог сборки — 80 % строк."
            ''
            '| Класс | Строки | Ветви |'
            '| --- | --- | --- |'
          )
          $classes = $xml.coverage.packages.package.classes.class |
            Where-Object { $_.name -notmatch '[<>/]' } |
            Sort-Object { [double]::Parse($_.'line-rate', $culture) }
          foreach ($class in $classes) {
            $lines += "| ``$($class.name)`` | $(Format-Rate $class.'line-rate') | $(Format-Rate $class.'branch-rate') |"
          }
          $lines -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: TestResults/Coverage/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Проверка уязвимых NuGet-зависимостей
        shell: pwsh
        run: |
          $json = dotnet list Ven4Tools.sln package --vulnerable --include-transitive --format json | Out-String | ConvertFrom-Json
          $vulnerable = @(
            $json.projects.frameworks.topLevelPackages
            $json.projects.frameworks.transitivePackages
          ) | Where-Object { $_.vulnerabilities.Count -gt 0 }
          if ($vulnerable.Count -gt 0) {
            $vulnerable | Format-Table id, resolvedVersion
            throw "Обнаружены уязвимые NuGet-зависимости."
          }

      - name: Артефакты неуспешных тестов
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-failures
          path: |
            TestResults/**/*.trx
            TestResults/Coverage/**
          if-no-files-found: warn
