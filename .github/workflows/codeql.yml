name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Анализ CodeQL (C#)
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Настройка .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Инициализация CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: csharp
          # Расширенный набор: к базовым правилам добавляются проверки с меньшей
          # точностью (больше находок на разбор), но шире по классам уязвимостей.
          queries: security-extended

      - name: Восстановление зависимостей
        run: dotnet restore Ven4Tools.sln --nologo

      - name: Сборка solution (под наблюдением CodeQL)
        run: dotnet build Ven4Tools.sln -c Release --no-restore --nologo

      - name: Анализ CodeQL
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:csharp"
