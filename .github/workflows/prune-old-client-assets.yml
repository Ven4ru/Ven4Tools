name: Очистка старых ассетов клиента

on:
  release:
    # released — перевод предрелиза в стабильный: публикация самого предрелиза
    # ничего не чистит (см. проверку ниже), чистка случается именно здесь.
    # Обычная публикация стабильного релиза шлёт оба события — прогоны идут по
    # очереди (concurrency), и второй просто не находит, что удалять.
    types: [published, released]

concurrency:
  group: prune-old-client-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prune:
    name: Удалить zip у предыдущих клиентских релизов
    runs-on: ubuntu-latest
    steps:
      - name: Удалить устаревшие ассеты
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          # Предрелиз не становится актуальной версией: лаунчер берёт «latest» только
          # из стабильных релизов с zip (ClientVersionMapper.FindFirstStableClientRelease).
          # Снятие zip у текущего стабильного по публикации предрелиза оставило бы
          # лаунчер вообще без устанавливаемой версии клиента.
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Релиз $CURRENT_TAG — предрелиз, пропуск."
            exit 0
          fi

          # Публикация клиентского релиза (тег vX.Y.Z, не launcher-vX.Y.Z) — повод
          # убрать zip у всех остальных клиентских релизов: скачивание версии без
          # прикреплённого к ней SHA256 из version.json (хеш там есть только для
          # текущей версии) было MEDIUM-находкой аудита безопасности 2026-07-13.
          # Срабатывает на "published", а не на создание черновика в release.yml —
          # иначе между удалением старого ассета и ручной публикацией нового
          # релиза был бы момент, когда скачать клиент вообще нечем.
          # Релизы лаунчера (launcher-vX.Y.Z) используют отдельный механизм
          # самообновления через CDN + ECDSA-подпись и не затрагиваются.
          if [[ ! "$CURRENT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Тег $CURRENT_TAG — не клиентский релиз, пропуск."
            exit 0
          fi

          tags=$(gh release list --repo "$REPO" --limit 100 --json tagName -q '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v -x "$CURRENT_TAG" || true)

          current_ver="${CURRENT_TAG#v}"
          for tag in $tags; do
            # Только релизы с версией НИЖЕ опубликованного. Публикация более старого
            # релиза (перевыпуск/хотфикс предыдущей ветки после выхода новой)
            # иначе снесла бы zip у актуальной версии — и у черновика следующей,
            # в который уже загружен архив автора.
            ver="${tag#v}"
            if [ "$(printf '%s\n%s\n' "$ver" "$current_ver" | sort -V | head -n1)" != "$ver" ]; then
              echo "Пропуск $tag: версия не ниже $CURRENT_TAG."
              continue
            fi
            assets=$(gh release view "$tag" --repo "$REPO" --json assets -q '.assets[].name' || true)
            for asset in $assets; do
              [ -z "$asset" ] && continue
              echo "Удаляю $asset из $tag"
              gh release delete-asset "$tag" "$asset" --repo "$REPO" -y
            done
          done
