name: Проверка интерфейса

# В обязательные проверки PR не входит: на hosted-раннере тесты зависят от
# рендеринга шрифтов и доступности winget. Но запускался этот набор только
# вручную, то есть практически никогда, и регрессии интерфейса копились до
# предрелизного прогона. Еженедельный запуск даёт сигнал между релизами.
on:
  schedule:
    # Понедельник, 04:41 UTC (07:41 МСК).
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-ui:
    name: Windows UI smoke
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Настройка .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Сборка
        run: dotnet build Ven4Tools.sln -c Release --nologo -v minimal -warnaserror

      - name: Разрешение экрана раннера под окна лаунчера/клиента
        shell: pwsh
        run: ./tests/scripts/set_ci_display_resolution.ps1

      # Оба набора — лаунчера и клиента — прогоняются дважды: в прежнем и в новом виде окна.
      # Второй прогон идёт, даже если первый упал, — иначе о новом виде ничего не узнать.
      - name: UI smoke и snapshot (лаунчер) — прежний интерфейс
        env:
          VEN4TOOLS_UITEST_SHELL: classic
        run: dotnet test tests/Ven4Tools.UITests/Ven4Tools.UITests.csproj -c Release -p:Platform=x64 --no-build --no-restore --nologo --logger "trx;LogFileName=launcher-ui-classic.trx" --results-directory TestResults/UI

      - name: UI smoke и snapshot (лаунчер) — новый интерфейс
        if: always()
        env:
          VEN4TOOLS_UITEST_SHELL: modern
        run: dotnet test tests/Ven4Tools.UITests/Ven4Tools.UITests.csproj -c Release -p:Platform=x64 --no-build --no-restore --nologo --logger "trx;LogFileName=launcher-ui-modern.trx" --results-directory TestResults/UI

      - name: UI-тесты клиента — прежний интерфейс
        env:
          VEN4TOOLS_UITEST_SHELL: classic
        run: dotnet test Ven4Tools.ClientUITests/Ven4Tools.ClientUITests.csproj -c Release -p:Platform=x64 --no-build --no-restore --nologo --filter "FullyQualifiedName!~ScreenshotGeneration" --logger "trx;LogFileName=client-ui-classic.trx" --results-directory TestResults/ClientUI

      - name: UI-тесты клиента — новый интерфейс
        if: always()
        env:
          VEN4TOOLS_UITEST_SHELL: modern
        run: dotnet test Ven4Tools.ClientUITests/Ven4Tools.ClientUITests.csproj -c Release -p:Platform=x64 --no-build --no-restore --nologo --filter "FullyQualifiedName!~ScreenshotGeneration" --logger "trx;LogFileName=client-ui-modern.trx" --results-directory TestResults/ClientUI

      - name: Диагностика падения
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-failure
          path: |
            TestResults/**/*.trx
            TestResults/**/*.actual.png
          if-no-files-found: warn
